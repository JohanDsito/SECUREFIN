[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
testpaths = tests
addopts = --strict-markers -ra
markers =
    unit: pruebas unitarias sin base de datos
    integration: integración API + PostgreSQL
    session_conformance: conformidad del motor de sesión (obligatoria antes de actualizar Django)
    security: pruebas de seguridad negativas
    contract: pruebas de contrato de la API
    acceptance: escenarios de aceptación de la spec
    stack: necesitan el stack completo de Docker Compose (fallan, no se omiten, si no responde)

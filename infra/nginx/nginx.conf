# Nginx: único punto de entrada de SecureFin (T010; Principios III y IV; R3, R7, R10, R12).
worker_processes auto;
# Nginx corre como usuario sin privilegios (USER nginx en el Dockerfile; Trivy DS-0002): el PID y
# los archivos temporales van a /tmp, el único sitio donde ese usuario puede escribir.
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;

    # Logs sin cuerpos, cookies, cabecera Authorization ni query strings (los tokens viajan en el
    # fragmento de la URL, que el navegador nunca envía; T-18).
    log_format securefin '$remote_addr [$time_iso8601] "$request_method $uri" $status '
                         '$body_bytes_sent $request_time';
    access_log /dev/stdout securefin;
    error_log  /dev/stderr warn;

    client_max_body_size 16k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Mitigación de DoS / inundación HTTP en capa 7 (rate limiting por IP, ngx_http_limit_req_module).
    # Tres zonas: autenticación (estricta), resto de la API y SPA estático. Al superar el límite se
    # responde 429 Too Many Requests (no 503) para distinguir la limitación de una caída real.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m  rate=30r/s;
    limit_req_zone $binary_remote_addr zone=web:10m  rate=50r/s;
    limit_req_status 429;
    limit_req_log_level warn;

    # Conexiones simultáneas por IP (ngx_http_limit_conn_module) y tiempos máximos para cortar
    # clientes lentos (slowloris): una IP no puede acaparar los workers.
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn_status 429;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    # Un solo rango por petición: evita respuestas multipart/byteranges con muchos rangos, el vector de
    # amplificación del DoS de CVE-2011-3192 que detecta `nmap --script vuln` (evidencia E3).
    max_ranges 1;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_certificate     /run/secrets/tls_cert;
    ssl_certificate_key /run/secrets/tls_key;

    upstream backend { server backend:8000; }
    upstream mailpit { server mailpit:8025; }

    # 80 -> 443 (HTTP plano solo para redirigir)
    server {
        listen 80;
        server_name securefin.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name securefin.local;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;

        limit_conn perip 20;

        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID "";
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;   # sobrescribe: la IP real la fija Nginx
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID "";
        }

        location / {
            limit_req zone=web burst=100 nodelay;
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # El SPA (index.html, /reset, /activate, /forgot-password) nunca se cachea (R7)
        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=86400" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Frame-Options "DENY" always;
        }
    }

    # Proxy de Mailpit: publicado SOLO en 127.0.0.1:8025 por Compose, con TLS (R10).
    # Doble autenticación con la MISMA credencial Basic: Nginx la valida y la reenvía a Mailpit,
    # que la valida de nuevo con MP_UI_AUTH_FILE. HTTP plano en este puerto no sirve contenido.
    server {
        listen 8025 ssl;
        server_name 127.0.0.1;

        auth_basic           "SecureFin Lab Mailbox";
        auth_basic_user_file /run/secrets/mailpit_htpasswd;

        add_header Strict-Transport-Security "max-age=86400" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        location / {
            proxy_pass http://mailpit;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
